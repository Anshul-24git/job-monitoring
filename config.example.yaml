email:
  smtp_host: smtp.gmail.com
  smtp_port: 587
  user: epicchutiya7@gmail.com
  from: epicchutiya7@gmail.com
  to: epicchutiya7@gmail.com
  app_password_env: JOB_MONITOR_GMAIL_APP_PASSWORD
  notify_on_errors: true
  error_email_cooldown_minutes: 60

notifications:
  skip_first_run: true
  ignore_error_statuses:
    - 404
    - 410

schedule:
  timezone: America/Chicago
  active_hours:
    start: "00:00"
    end: "23:59"
  default_interval_minutes: 20
  sleep_seconds: 20

env_file: .env
auto_sources_file: auto_sources.yaml

filters:
  include_keywords:
    - sde
    - software engineer
    - senior software engineer
    - sr software engineer
    - sr. software engineer
    - seniorsoftware engineer
    - software engineering
    - software developer
    - software development engineer
    - backend engineer
    - back-end engineer
    - full-stack engineer
    - full stack engineer
    - full-stack software developer
    - full stack software developer
    - frontend engineer
    - front-end engineer
    - platform engineer
    - infrastructure engineer
    - systems engineer
    - machine learning engineer
    - ml engineer
    - ai engineer
    - applied scientist
  exclude_keywords:
    - sales
    - support engineer
    - sre
    - site reliability
    - devops
    - dev ops
    - mobile
    - android
    - ios
    - data engineer
    - data engineering
  location:
    us_only: true
    allow_remote_without_us_signal: false

sources:
  - name: Apple
    url: https://jobs.apple.com/en-us/search?location=united-states-USA
    interval_minutes: 20
    assume_us_only: true
  - name: Microsoft
    url: https://apply.careers.microsoft.com/careers?query=software+engineer&start=0&location=united+states&pid=1970393556621801&sort_by=timestamp&filter_include_remote=1
    interval_minutes: 20
    assume_us_only: true
  - name: Google
