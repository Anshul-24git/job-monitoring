email:
  smtp_host: smtp.gmail.com
  smtp_port: 587
  user: you@example.com
  from: you@example.com
  to: you@example.com
  app_password_env: JOB_MONITOR_GMAIL_APP_PASSWORD
  notify_on_errors: true
  error_email_cooldown_minutes: 60

notifications:
  skip_first_run: true
  seed_recent_hours: 24
  seed_require_posted_at: true
  ignore_error_statuses:
    - 404
    - 410

schedule:
  timezone: America/Chicago
  active_hours:
    start: "00:00"
    end: "23:59"
  default_interval_minutes: 20
  sleep_seconds: 20

env_file: .env
auto_sources_file: auto_sources.yaml

filters:
  include_keywords:
    - sde
    - software engineer
    - senior software engineer
    - sr software engineer
    - sr. software engineer
    - seniorsoftware engineer
    - software engineering
    - software developer
    - software development engineer
    - backend engineer
    - back-end engineer
    - full-stack engineer
    - full stack engineer
    - full-stack software developer
    - full stack software developer
    - frontend engineer
    - front-end engineer
    - platform engineer
    - infrastructure engineer
    - systems engineer
    - machine learning engineer
    - ml engineer
    - ai engineer
    - ai software engineer
    - forward deployed engineer
    - forward deployed ai engineer
    - ai forward deployed engineer
    - applied scientist
  exclude_keywords:
    - sales
    - support engineer
    - sre
    - site reliability
    - devops
    - dev ops
    - mobile
    - android
    - ios
    - data engineer
    - data engineering
    - staff software engineer
    - principal software engineer
    - machine learning engineer
    - staff machine learning engineer
    - software engineer manager
    - software engineering manager
    - staff
    - sr director
    - sr. director
    - senior director
  location:
    us_only: true
    allow_remote_without_us_signal: false

